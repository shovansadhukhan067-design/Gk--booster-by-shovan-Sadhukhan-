<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Booster - CGL 2026 Target</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 580px;
            text-align: center;
            position: relative;
        }
        .lang-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #f1f2f6;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover { background-color: #dfe4ea; }
        h2 { color: #333; margin-bottom: 20px; font-size: 24px; margin-top: 15px; }
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .cat-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #495057;
        }
        .cat-btn:hover { background-color: #e2e6ea; transform: translateY(-2px); }
        .cat-history:hover { border-color: #ff9f43; color: #ff9f43; }
        .cat-geography:hover { border-color: #0abde3; color: #0abde3; }
        .cat-polity:hover { border-color: #10ac84; color: #10ac84; }
        .cat-science:hover { border-color: #ee5253; color: #ee5253; }
        .cat-math:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .cat-ca:hover { border-color: #feca57; color: #feca57; }
        .cat-english:hover { border-color: #54a0ff; color: #54a0ff; }
        
        .progress { font-size: 14px; color: #666; margin-bottom: 15px; font-weight: bold; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn {
            background-color: #f0f2f5;
            border: 2px solid #e4e6eb;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; }
        
        .explanation-box {
            background-color: #e8f4fd;
            border-left: 5px solid #1da1f2;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
            color: #2c3e50;
            display: none;
            line-height: 1.5;
        }
        .explanation-title { font-weight: bold; color: #1da1f2; margin-bottom: 5px; }
        .next-btn {
            background-color: #4a6cf7; color: white; border: none; border-radius: 8px;
            padding: 12px 25px; font-size: 16px; cursor: pointer; display: none; width: 100%; font-weight: bold;
        }
        .screen { display: none; }
        .active-screen { display: block; }
        .score-text { font-size: 22px; margin-bottom: 20px; color: #333; }
        .restart-btn { background-color: #2ecc71; color: white; border: none; border-radius: 8px; padding: 12px 25px; font-size: 16px; cursor: pointer; font-weight: bold; }

</head>
<body>

<div class="quiz-container">
    <button class="lang-btn" id="lang-toggle-btn" onclick="toggleLanguage()">English</button>
    
    <!-- ক্যাটাগরি স্ক্রিন -->
    <div id="category-screen" class="screen active-screen">
        <h2 id="menu-title">📚 Target SSC CGL 2026 Master Board</h2>
        <div class="category-grid">
            <button class="cat-btn cat-history" onclick="startQuiz('history')"><span id="cat-h-text">📜 ইতিহাস (২০)</span></button>
            <button class="cat-btn cat-geography" onclick="startQuiz('geography')"><span id="cat-g-text">🌍 ভূগোল (২০)</span></button>
            <button class="cat-btn cat-polity" onclick="startQuiz('polity')"><span id="cat-p-text">⚖️ রাষ্ট্রবিজ্ঞান (২০)</span></button>
            <button class="cat-btn cat-science" onclick="startQuiz('science')"><span id="cat-s-text">🧪 বিজ্ঞান (২০)</span></button>
            <button class="cat-btn cat-math" onclick="startQuiz('math')"><span id="cat-m-text">🔢 গণিত (২০)</span></button>
            <button class="cat-btn cat-ca" onclick="startQuiz('ca')"><span id="cat-c-text">🔥 কারেন্ট অ্যাফেয়ার্স (২০)</span></button>
            <button class="cat-btn cat-english" onclick="startQuiz('english')"><span id="cat-e-text">🔤 ইংরেজি (২০)</span></button>
        </div>
    </div>

    <!-- কুইজ স্ক্রিন -->
    <div id="quiz-screen" class="screen">
        <div class="progress" id="progress-text">Question 1</div>
        <h2 id="question-text">Loading...</h2>
        <div class="options-container" id="options-box"></div>
        
        <div class="explanation-box" id="explanation-container">
            <div class="explanation-title" id="exp-title-text">💡 সমাধান ও ব্যাখ্যা:</div>
            <div id="explanation-text">Explanation.</div>
        </div>
        <button class="next-btn" id="next-button" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <!-- রেজাল্ট স্ক্রিন -->
    <div id="result-screen" class="screen">
        <h2 id="result-title">🎉 কুইজ সম্পূর্ণ হয়েছে! 🎉</h2>
        <p class="score-text" id="final-score-text">Your Score: 0</p>
        <button class="restart-btn" id="home-btn-text" onclick="goToHome()">মূল মেনু 🔄</button>
    </div>
</div>

function updateUI() {
    document.getElementById("menu-title").innerText = uiLabels[currentLang].menuTitle;
    document.getElementById("cat-h-text").innerText = uiLabels[currentLang].history;
    document.getElementById("cat-g-text").innerText = uiLabels[currentLang].geography;
    document.getElementById("cat-p-text").innerText = uiLabels[currentLang].polity;
    document.getElementById("cat-s-text").innerText = uiLabels[currentLang].science;
    document.getElementById("cat-m-text").innerText = uiLabels[currentLang].math;
    document.getElementById("cat-c-text").innerText = uiLabels[currentLang].ca;
    document.getElementById("cat-e-text").innerText = uiLabels[currentLang].english;
    document.getElementById("next-button").innerText = uiLabels[currentLang].nextBtn;
    document.getElementById("exp-title-text").innerText = uiLabels[currentLang].expTitle;
    document.getElementById("result-title").innerText = uiLabels[currentLang].resultTitle;
    document.getElementById("home-btn-text").innerText = uiLabels[currentLang].homeBtn;
    document.getElementById("lang-toggle-btn").innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
    
    if(document.getElementById("quiz-screen").classList.contains("active-screen")) {
        currentQuestions = quizQuestions[currentLang][currentCategory];
        let currentQuestion = currentQuestions[currentQuestionIndex];
        document.getElementById("question-text").innerText = currentQuestion.question;
        document.getElementById("progress-text").innerText = `${uiLabels[currentLang].progress} ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
        let buttons = document.getElementById("options-box").children;
        for(let i=0; i<buttons.length; i++) { buttons[i].innerText = currentQuestion.options[i]; }
        if(answered) { document.getElementById("explanation-text").innerText = currentQuestion.exp; }
    }
}

function toggleLanguage() { currentLang = currentLang === 'bn' ? 'en' : 'bn'; updateUI(); }
function startQuiz(category) {
    currentCategory = category; currentQuestions = quizQuestions[currentLang][currentCategory];
    currentQuestionIndex = 0; score = 0;
    document.getElementById("category-screen").classList.remove("active-screen");
    document.getElementById("quiz-screen").classList.add("active-screen");
    loadQuestion();
}

function loadQuestion() {
    answered = false; document.getElementById("next-button").style.display = "none";
    document.getElementById("explanation-container").style.display = "none";
    let currentQuestion = currentQuestions[currentQuestionIndex];
    document.getElementById("progress-text").innerText = `${uiLabels[currentLang].progress} ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
    document.getElementById("question-text").innerText = currentQuestion.question;
    let optionsBox = document.getElementById("options-box"); optionsBox.innerHTML = "";
    currentQuestion.options.forEach((option, index) => {
        let button = document.createElement("button"); button.innerText = option; button.classList.add("option-btn");
        button.onclick = () => selectOption(button, index); optionsBox.appendChild(button);
    });
}

function selectOption(selectedBtn, optionIndex) {
    if(answered) return; answered = true;
    let currentQuestion = currentQuestions[currentQuestionIndex];
    let allOptions = document.getElementById("options-box").children;
    if(optionIndex === currentQuestion.correct) { selectedBtn.classList.add("correct"); score++; }
    else { selectedBtn.classList.add("wrong"); allOptions[currentQuestion.correct].classList.add("correct"); }
    document.getElementById("explanation-text").innerText = currentQuestion.exp;
    document.getElementById("explanation-container").style.display = "block";
    document.getElementById("next-button").style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    if(currentQuestionIndex < currentQuestions.length) { loadQuestion(); }
    else {
        document.getElementById("quiz-screen").classList.remove("active-screen");
        document.getElementById("result-screen").classList.add("active-screen");
        document.getElementById("final-score-text").innerText = `Your Score: ${score} / ${currentQuestions.length}`;
    }
}
function goToHome() {
    document.getElementById("result-screen").classList.remove("active-screen");
    document.getElementById("category-screen").classList.add("active-screen");
}
updateUI();
</script>
