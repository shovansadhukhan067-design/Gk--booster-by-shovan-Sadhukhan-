<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Booster - Ultimate Quiz App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 550px;
            text-align: center;
            position: relative;
        }
        .lang-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #f1f2f6;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background-color: #dfe4ea;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            margin-top: 15px;
        }
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .cat-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 18px 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #495057;
        }
        .cat-btn:hover {
            background-color: #e2e6ea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .cat-history:hover { border-color: #ff9f43; color: #ff9f43; }
        .cat-geography:hover { border-color: #0abde3; color: #0abde3; }
        .cat-polity:hover { border-color: #10ac84; color: #10ac84; }
        .cat-science:hover { border-color: #ee5253; color: #ee5253; }
        .cat-math:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .cat-ca:hover { border-color: #feca57; color: #feca57; }
        .cat-english:hover { border-color: #54a0ff; color: #54a0ff; }

        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #f0f2f5;
            border: 2px solid #e4e6eb;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }
        .option-btn:hover {
            background-color: #e4e6eb;
        }
        .correct {
            background-color: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
        }
        .wrong {
            background-color: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
        }
        .explanation-box {
            background-color: #e8f4fd;
            border-left: 5px solid #1da1f2;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 15px;
            color: #2c3e50;
            display: none;
            line-height: 1.5;
        }
        .explanation-title {
            font-weight: bold;
            color: #1da1f2;
            margin-bottom: 5px;
        }
        .next-btn {
            background-color: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-weight: bold;
        }
        .next-btn:hover {
            background-color: #3554d1;
        }
        .screen {
            display: none;
        }
        .active-screen {
            display: block;
        }
        .score-text {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }
        .restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <button class="lang-btn" id="lang-toggle-btn" onclick="toggleLanguage()">English</button>
    
    <!-- স্ক্রিন ১: সাবজেক্ট সিলেকশন (৭টি ক্যাটাগরি) -->
    <div id="category-screen" class="screen active-screen">
        <h2 id="menu-title">📚 একটি বিষয় বেছে নিন</h2>
        <div class="category-grid">
            <button class="cat-btn cat-history" onclick="startQuiz('history')"><span id="cat-h-text">📜 ইতিহাস</span></button>
            <button class="cat-btn cat-geography" onclick="startQuiz('geography')"><span id="cat-g-text">🌍 ভূগোল</span></button>
            <button class="cat-btn cat-polity" onclick="startQuiz('polity')"><span id="cat-p-text">⚖️ রাষ্ট্রবিজ্ঞান</span></button>
            <button class="cat-btn cat-science" onclick="startQuiz('science')"><span id="cat-s-text">🧪 বিজ্ঞান</span></button>
            <button class="cat-btn cat-math" onclick="startQuiz('math')"><span id="cat-m-text">🔢 গণিত</span></button>
            <button class="cat-btn cat-ca" onclick="startQuiz('ca')"><span id="cat-c-text">🔥 কারেন্ট অ্যাফেয়ার্স</span></button>
            <button class="cat-btn cat-english" onclick="startQuiz('english')"><span id="cat-e-text">🔤 ইংরেজি</span></button>
        </div>
    </div>

    <!-- স্ক্রিন ২: মূল কুইজ স্ক্রিন -->
    <div id="quiz-screen" class="screen">
        <div class="progress" id="progress-text">Question 1 of 5</div>
        <h2 id="question-text">Loading Question...</h2>
        <div class="options-container" id="options-box">
            <!-- Options load here -->
        </div>
        
        <div class="explanation-box" id="explanation-container">
            <div class="explanation-title" id="exp-title-text">💡 সঠিক উত্তর ও তথ্য:</div>
            <div id="explanation-text">Explanation text.</div>
        </div>

        <button class="next-btn" id="next-button" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <!-- স্ক্রিন ৩: রেজাল্ট স্ক্রিন -->
    <div id="result-screen" class="screen">
        <h2 id="result-title">🎉 কুইজ সম্পূর্ণ হয়েছে! 🎉</h2>
        <p class="score-text" id="final-score-text">Your Score: 0 / 5</p>
        <button class="restart-btn" id="home-btn-text" onclick="goToHome()">মূল মেনু 🔄</button>
    </div>
</div>

<script>
let currentLang = 'bn'; 
let currentCategory = '';
let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let answered = false;

const uiLabels = {
    bn: {
        menuTitle: "📚 একটি বিষয় বেছে নিন",
        history: "📜 ইতিহাস", geography: "🌍 ভূগোল", polity: "⚖️ রাষ্ট্রবিজ্ঞান", science: "🧪 বিজ্ঞান",
        math: "🔢 গণিত", ca: "🔥 কারেন্ট অ্যাফেয়ার্স", english: "🔤 ইংরেজি",
        nextBtn: "পরবর্তী প্রশ্ন ➔", expTitle: "💡 সঠিক উত্তর ও সমাধান:",
        resultTitle: "🎉 কুইজ সম্পূর্ণ হয়েছে! 🎉", homeBtn: "মূল মেনু 🔄", progress: "প্রশ্ন"
    },
    en: {
        menuTitle: "📚 Choose a Subject",

        math: "🔢 Mathematics", ca: "🔥 Current Affairs", english: "🔤 English",
        nextBtn: "Next Question ➔", expTitle: "💡 Correct Answer & Solution:",

};

// প্রশ্ন ও উত্তর ডাটাবেস (নতুন বিষয়সহ ৫টি করে নমুনা প্রশ্ন সেট করা হলো, আপনি পরে বাড়াতে পারবেন)
const quizQuestions = {
    bn: {
        history: [
            { question: "আজাদ হিন্দ ফৌজ কে গঠন করেছিলেন?", options: ["মহাত্মা গান্ধী", "নেতাজী সুভাষচন্দ্র বসু", "রাসবিহারী বসু", "ভগত সিং"], correct: 2, exp: "১৯৪২ সালে টোকিওতে রাসবিহারী বসু এটি গঠন করেন। পরে নেতাজী এর নেতৃত্বভার নেন।" },
            { question: "পলাশীর যুদ্ধ কত সালে হয়েছিল?", options: ["১৭৫৭", "১৭৬৪", "১৮৫৭", "১৯৪৭"], correct: 0, exp: "১৭৫৭ সালের ২৩শে জুন নবাব সিরাজউদ্দৌলা এবং ব্রিটিশ ইস্ট ইন্ডিয়া কোম্পানির রবার্ট ক্লাইভের মধ্যে এই যুদ্ধ হয়েছিল।" }
        ],
        geography: [
            { question: "বিশ্বের বৃহত্তম মহাসাগর কোনটি?", options: ["আটলান্টিক মহাসাগর", "ভারত মহাসাগর", "প্রশান্ত মহাসাগর", "উত্তর মহাসাগর"], correct: 2, exp: "প্রশান্ত মহাসাগর হলো পৃথিবীর বৃহত্তম ও গভীরতম মহাসাগর।" },
            { question: "কোন গ্রহকে 'লাল গ্রহ' বলা হয়?", options: ["শুক্র", "বুধ", "মঙ্গল", "বৃহস্পতি"], correct: 2, exp: "মঙ্গল গ্রহের মাটিতে প্রচুর আয়রন অক্সাইড থাকায় এর রঙ লাল দেখায়।" }
        ],
        polity: [
            { question: "ভারতের সংবিধান কবে থেকে কার্যকর হয়?", options: ["২৬ নভেম্বর ১৯৪৯", "২৬ জানুয়ারি ১৯৫০", "১৫ আগস্ট ১৯৪৭", "৩০ জানুয়ারি ১৯৪৮"], correct: 1, exp: "১৯৫০ সালের ২৬শে জানুয়ারি থেকে এটি পূর্ণাঙ্গভাবে কার্যকর করা হয় এবং এই দিনটি 'প্রজাতন্ত্র দিবস' হিসেবে পালিত হয়।" },
            { question: "কাকে भारतीय সংবিধানের জনক বলা হয়?", options: ["ডঃ রাজেন্দ্র প্রসাদ", "মহাত্মা গান্ধী", "জওহরলাল নেহেরু", "ডঃ বি. আর. আম্বেদকর"], correct: 3, exp: "সংবিধানের খসড়া কমিটির চেয়ারম্যান ডঃ বি. আর. আম্বেদকরকে ভারতীয় সংবিধানের জনক বলা হয়।" }
        ],
        science: [
            { question: "কম্পিউটারের মস্তিষ্ক কাকে বলা হয়?", options: ["RAM", "Monitor", "CPU", "Hard Disk"], correct: 2, exp: "CPU (Central Processing Unit) কম্পিউটারের সমস্ত ডেটা প্রসেসিং নিয়ন্ত্রণ করে।" },
            { question: "কোন ভিটামিনের অভাবে স্কার্ভি রোগ হয়?", options: ["ভিটামিন A", "ভিটামিন B", "ভিটামিন C", "ভিটামিন D"], correct: 2, exp: "ভিটামিন C এর অভাবে স্কার্ভি রোগ হয়। টক জাতীয় ফলে এই ভিটামিন প্রচুর থাকে।" }
        ],
        // 🔢 গণিত সেকশন (Short Tricks সহ ব্যাখ্যা)
        math: [
            { question: "দুটি সংখ্যার অনুপাত ৩:৪ এবং তাদের গসাগু (HCF) ৪ হলে, সংখ্যা দুটির লসাগু (LCM) কত?", options: ["১২", "২৪", "৪৮", "৩৬"], correct: 2, exp: "শর্ট ট্রিক: লসাগু = অনুপাতদ্বয়ের গুণফল × গসাগু। অর্থাৎ, ৩ × ৪ × ৪ = ৪৮।" },
            { question: "একটি বস্তু ২৭০ টাকায় বিক্রি করায় ১০% ক্ষতি হলো। বস্তুটির ক্রয়মূল্য কত ছিল?", options: ["২৪৩ টাকা", "৩০০ টাকা", "২৮০ টাকা", "৩২০ টাকা"], correct: 1, exp: "১০% ক্ষতি মানে বিক্রয়মূল্য ৯০%। সুতরাং, ৯০% = ২৭০ টাকা হলে, ১০০% (ক্রয়মূল্য) = (২৭০ × ১০০) / ৯০ = ৩০০ টাকা।" }
        ],
        // 🔥 কারেন্ট অ্যাফেয়ার্স সেকশন
        ca: [
            { question: "২০২৪ সালের টি-২০ বিশ্বকাপ (T20 World Cup) কোন দেশ জিতেছে?", options: ["দক্ষিণ আফ্রিকা", "ভারত", "অস্ট্রেলিয়া", "ইংল্যান্ড"], correct: 1, exp: "২০২৪ সালের জুন মাসে ফাইনালে দক্ষিণ আফ্রিকাকে হারিয়ে ভারত দ্বিতীয়বারের জন্য টি-২০ বিশ্বকাপ চ্যাম্পিয়ন হয়।" },

        ],
        // 🔤 ইংরেজি সেকশন
        english: [
            { question: "Select the correct Synonym of 'ABANDON':", options: ["Keep", "Leave / Forsake", "Support", "Adopt"], correct: 1, exp: "'Abandon' মানে বর্জন করা বা ছেড়ে দেওয়া। এর সমার্থক শব্দ (Synonym) হলো 'Leave' বা 'Forsake'।" },
            { question: "Fill in the blank: He is proficient ________ English.", options: ["in", "at", "with", "for"], correct: 0, exp: "'Proficient' শব্দটির পর উপযুক্ত Preposition হিসেবে 'in' বসে (Proficient in something মানে কোনো বিষয়ে দক্ষ)।" }
        ]
    },
    en: {
        history: [
            { question: "Who founded the Azad Hind Fauj?", options: ["Mahatma Gandhi", "Netaji Subhas Chandra Bose", "Rash Behari Bose", "Bhagat Singh"], correct: 2, exp: "Rash Behari Bose founded the INA in Tokyo in 1942. Later, Netaji took over leadership." },
            { question: "In which year did the Battle of Plassey take place?", options: ["1757", "1764", "1857", "1947"], correct: 0, exp: "Fought on 23 June 1757 between Nawab Siraj-ud-Daulah and Robert Clive of the British East India Company." }
        ],
        geography: [
            { question: "Which is the largest ocean in the world?", options: ["Atlantic Ocean", "Indian Ocean", "Pacific Ocean", "Arctic Ocean"], correct: 2, exp: "The Pacific Ocean is the largest and deepest ocean on Earth." },
            { question: "Which planet is known as the 'Red Planet'?", options: ["Venus", "Mercury", "Mars", "Jupiter"], correct: 2, exp: "Mars is called the Red Planet due to the abundance of iron oxide on its surface." }
        ],
        polity: [
            { question: "When did the Constitution of India come into force?", options: ["26 Nov 1949", "26 Jan 1950", "15 Aug 1947", "30 Jan 1948"], correct: 1, exp: "It came into full force on 26 January 1950, celebrated as Republic Day." },
            { question: "Who is known as the Father of the Indian Constitution?", options: ["Dr. Rajendra Prasad", "Mahatma Gandhi", "Jawaharlal Nehru", "Dr. B. R. Ambedkar"], correct: 3, exp: "Dr. B.R. Ambedkar is regarded as the Father of the Indian Constitution due to his role as Chairman of the Drafting Committee." }
        ],
        science: [
            { question: "Which is called the brain of the computer?", options: ["RAM", "Monitor", "CPU", "Hard Disk"], correct: 2, exp: "The CPU (Central Processing Unit) processes all information and controls computer functions." },
            { question: "Scurvy disease is caused by the deficiency of which vitamin?", options: ["Vitamin A", "Vitamin B", "Vitamin C", "Vitamin D"], correct: 2, exp: "Scurvy is caused by Vitamin C deficiency. Citrus fruits are rich sources of this vitamin." }
        ],
        // 🔢 Mathematics (English Version)
        math: [
            { question: "The ratio of two numbers is 3:4 and their HCF is 4. Find their LCM.", options: ["12", "24", "48", "36"], correct: 2, exp: "Short Trick: LCM = Product of Ratios × HCF. Therefore, 3 × 4 × 4 = 48." },
            { question: "By selling an article for ₹270, a loss of 10% is incurred. What was its cost price?", options: ["₹243", "₹300", "₹280", "₹320"], correct: 1, exp: "10% loss means Selling Price is 90%. So, 90% = 270. Therefore, 100% (CP) = (270 × 100) / 90 = ₹300." }
        ],
        // 🔥 Current Affairs (English Version)
        ca: [
            { question: "Which country won the Men's T20 World Cup in 2024?", options: ["South Africa", "India", "Australia", "England"], correct: 1, exp: "India won their second T20 World Cup title by defeating South Africa in the final in June 2024." },
            { question: "Who is the current Chief Election Commissioner of India (in 2026)?", options: ["Rajiv Kumar", "Anup Chandra Pandey", "Sunil Arora", "Hiralal Samariya"], correct: 0, exp: "Rajiv Kumar is the 25th Chief Election Commissioner of India." }
        ],
        // 🔤 English Section
        english: [
            { question: "Select the correct Synonym of 'ABANDON':", options: ["Keep", "Leave / Forsake", "Support", "Adopt"], correct: 1, exp: "'Abandon' means to completely leave or give up something. Synonyms include Leave or Forsake." },
            { question: "Fill in the blank: He is proficient ________ English.", options: ["in", "at", "with", "for"], correct: 0, exp: "The appropriate preposition after 'Proficient' is 'in' (Proficient in a language/subject)." }

};

function updateUI() {
    document.getElementById("menu-title").innerText = uiLabels[currentLang].menuTitle;
    document.getElementById("cat-h-text").innerText = uiLabels[currentLang].history;
    document.getElementById("cat-g-text").innerText = uiLabels[currentLang].geography;
    document.getElementById("cat-p-text").innerText = uiLabels[currentLang].polity;
    document.getElementById("cat-s-text").innerText = uiLabels[currentLang].science;
    document.getElementById("cat-m-text").innerText = uiLabels[currentLang].math;
    document.getElementById("cat-c-text").innerText = uiLabels[currentLang].ca;
    document.getElementById("cat-e-text").innerText = uiLabels[currentLang].english;
    document.getElementById("next-button").innerText = uiLabels[currentLang].nextBtn;
    document.getElementById("exp-title-text").innerText = uiLabels[currentLang].expTitle;
    document.getElementById("result-title").innerText = uiLabels[currentLang].resultTitle;
    document.getElementById("home-btn-text").innerText = uiLabels[currentLang].homeBtn;
    
    document.getElementById("lang-toggle-btn").innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
    
    if(document.getElementById("quiz-screen").classList.contains("active-screen")) {
        currentQuestions = quizQuestions[currentLang][currentCategory];
        let currentQuestion = currentQuestions[currentQuestionIndex];
        document.getElementById("question-text").innerText = currentQuestion.question;
        document.getElementById("progress-text").innerText = `${uiLabels[currentLang].progress} ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
        
        let buttons = document.getElementById("options-box").children;
        for(let i=0; i<buttons.length; i++) {
            buttons[i].innerText = currentQuestion.options[i];
        }
        if(answered) {
            document.getElementById("explanation-text").innerText = currentQuestion.exp;
        }
    }
}

function toggleLanguage() {
    currentLang = currentLang === 'bn' ? 'en' : 'bn';
    updateUI();
}

function startQuiz(category) {
    currentCategory = category;
    currentQuestions = quizQuestions[currentLang][currentCategory];
    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById("category-screen").classList.remove("active-screen");
    document.getElementById("quiz-screen").classList.add("active-screen");
    
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    document.getElementById("next-button").style.display = "none";
    document.getElementById("explanation-container").style.display = "none";
    
    let currentQuestion = currentQuestions[currentQuestionIndex];
    
    document.getElementById("progress-text").innerText = `${uiLabels[currentLang].progress} ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
    document.getElementById("question-text").innerText = currentQuestion.question;
    
    let optionsBox = document.getElementById("options-box");
    optionsBox.innerHTML = "";
    
    currentQuestion.options.forEach((option, index) => {
        let button = document.createElement("button");
        button.innerText = option;
        button.classList.add("option-btn");
        button.onclick = () => selectOption(button, index);
        optionsBox.appendChild(button);
    });
}

function selectOption(selectedBtn, optionIndex) {
    if(answered) return;
    answered = true;
    
    let currentQuestion = currentQuestions[currentQuestionIndex];
    let allOptions = document.getElementById("options-box").children;
    
    if(optionIndex === currentQuestion.correct) {
        selectedBtn.classList.add("correct");
        score++;
    } else {
        selectedBtn.classList.add("wrong");
        allOptions[currentQuestion.correct].classList.add("correct");
    }
    
    document.getElementById("explanation-text").innerText = currentQuestion.exp;
    document.getElementById("explanation-container").style.display = "block";
    
    document.getElementById("next-button").style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    
    if(currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
    } else {
        document.getElementById("quiz-screen").classList.remove("active-screen");
        document.getElementById("result-screen").classList.add("active-screen");
        document.getElementById("final-score-text").innerText = `Your Score: ${score} / ${currentQuestions.length}`;
    }
}

function goToHome() {
    document.getElementById("result-screen").classList.remove("active-screen");
    document.getElementById("category-screen").classList.add("active-screen");
}

updateUI();
</script>

</body>
</html>
