<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Booster - Multi-Language Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }
        
        /* Language Switcher Button Style */
        .lang-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #f1f2f6;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background-color: #dfe4ea;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            margin-top: 15px;
        }
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .cat-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #495057;
        }
        .cat-btn:hover {
            background-color: #e2e6ea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .cat-history:hover { border-color: #ff9f43; color: #ff9f43; }
        .cat-geography:hover { border-color: #0abde3; color: #0abde3; }
        .cat-polity:hover { border-color: #10ac84; color: #10ac84; }
        .cat-science:hover { border-color: #ee5253; color: #ee5253; }

        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #f0f2f5;
            border: 2px solid #e4e6eb;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }
        .option-btn:hover {
            background-color: #e4e6eb;
        }
        .correct {
            background-color: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
        }
        .wrong {
            background-color: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
        }
        
        .explanation-box {
            background-color: #e8f4fd;
            border-left: 5px solid #1da1f2;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 15px;
            color: #2c3e50;
            display: none;
            line-height: 1.5;
        }
        .explanation-title {
            font-weight: bold;
            color: #1da1f2;
            margin-bottom: 5px;
        }

        .next-btn {
            background-color: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-weight: bold;
        }
        .next-btn:hover {
            background-color: #3554d1;
        }
        .screen {
            display: none;
        }
        .active-screen {
            display: block;
        }
        .score-text {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }
        .restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Language Switcher Button -->
    <button class="lang-btn" id="lang-toggle-btn" onclick="toggleLanguage()">English</button>
    
    <!-- স্ক্রিন ১: সাবজেক্ট সিলেকশন -->
    <div id="category-screen" class="screen active-screen">
        <h2 id="menu-title">📚 একটি বিষয় বেছে নিন</h2>
        <div class="category-grid">
            <button class="cat-btn cat-history" onclick="startQuiz('history')"><span id="cat-h-text">📜 ইতিহাস</span></button>
            <button class="cat-btn cat-geography" onclick="startQuiz('geography')"><span id="cat-g-text">🌍 ভূগোল</span></button>
            <button class="cat-btn cat-polity" onclick="startQuiz('polity')"><span id="cat-p-text">⚖️ রাষ্ট্রবিজ্ঞান</span></button>
            <button class="cat-btn cat-science" onclick="startQuiz('science')"><span id="cat-s-text">🧪 বিজ্ঞান</span></button>
        </div>
    </div>

    <!-- স্ক্রিন ২: মূল কুইজ স্ক্রিন -->
    <div id="quiz-screen" class="screen">
        <div class="progress" id="progress-text">Question 1 of 10</div>
        <h2 id="question-text">Loading Question...</h2>
        <div class="options-container" id="options-box">
            <!-- Options load here -->
        </div>
        
        <!-- Explanation Box -->
        <div class="explanation-box" id="explanation-container">
            <div class="explanation-title" id="exp-title-text">💡 সঠিক উত্তর ও তথ্য:</div>
            <div id="explanation-text">Explanation text.</div>
        </div>

        <button class="next-btn" id="next-button" onclick="nextQuestion()">Next Question ➔</button>
    </div>

    <!-- স্ক্রিন ৩: রেজাল্ট স্ক্রিন -->
    <div id="result-screen" class="screen">
        <h2 id="result-title">🎉 কুইজ সম্পূর্ণ হয়েছে! 🎉</h2>
        <p class="score-text" id="final-score-text">Your Score: 0 / 10</p>
        <button class="restart-btn" id="home-btn-text" onclick="goToHome()">মূল মেনু 🔄</button>
    </div>
</div>

<script>
let currentLang = 'bn'; // ডিফল্ট ভাষা বাংলা

// ইন্টারফেসের লেখার অনুবাদ সমূহ
const uiLabels = {
    bn: {
        menuTitle: "📚 একটি বিষয় বেছে নিন",
        history: "📜 ইতিহাস", geography: "🌍 ভূগোল", polity: "⚖️ রাষ্ট্রবিজ্ঞান", science: "🧪 বিজ্ঞান",
        nextBtn: "পরবর্তী প্রশ্ন ➔", expTitle: "💡 সঠিক উত্তর ও তথ্য:",
        resultTitle: "🎉 কুইজ সম্পূর্ণ হয়েছে! 🎉", homeBtn: "মূল মেনু 🔄", progress: "প্রশ্ন"
    },
    en: {
        menuTitle: "📚 Choose a Subject",
        history: "📜 History", geography: "🌍 Geography", polity: "⚖️ Polity", science: "🧪 Science",
        nextBtn: "Next Question ➔", expTitle: "💡 Correct Answer & Fact:",
        resultTitle: "🎉 Quiz Completed! 🎉", homeBtn: "Main Menu 🔄", progress: "Question"
    }

// বিষয়ভিত্তিক প্রশ্ন, উত্তর এবং ব্যাখ্যাসহ ডাটাবেস (বাংলা ও ইংরেজি উভয় সংস্করণে)
const quizQuestions = {
    bn: {
        history: [
            { question: "আজাদ হিন্দ ফৌজ কে গঠন করেছিলেন?", options: ["মহাত্মা গান্ধী", "নেতাজী সুভাষচন্দ্র বসু", "রাসবিহারী বসু", "ভগত সিং"], correct: 2, exp: "১৯৪২ সালে টোকিওতে রাসবিহারী বসু এটি গঠন করেন। পরে নেতাজী এর নেতৃত্বভার নেন।" },
            { question: "পলাশীর যুদ্ধ কত সালে হয়েছিল?", options: ["১৭৫৭", "১৭৬৪", "১৮৫৭", "১৯৪৭"], correct: 0, exp: "১৭৫৭ সালের ২৩শে জুন নবাব সিরাজউদ্দৌলা এবং ব্রিটিশ ইস্ট ইন্ডিয়া কোম্পানির রবার্ট ক্লাইভের মধ্যে এই যুদ্ধ হয়েছিল।" },
            { question: "সিন্ধু সভ্যতার অবশিষ্টাংশ 'লোথাল' কোথায় অবস্থিত?", options: ["পাঞ্জাব", "রাজস্থান", "গুজরাট", "সিন্ধু প্রদেশ"], correct: 2, exp: "লোথাল হলো সিন্ধু সভ্যতার প্রাচীনতম একটি বন্দর শহর, যা বর্তমান ভারতের ગુજરાત রাজ্যে অবস্থিত।" },
            { question: "কাকে 'ভারতের নেপোলিয়ন' বলা হতো?", options: ["চন্দ্রগুপ্ত মৌর্য", "সমুদ্রগুপ্ত", "আকবর", "কনিষ্ক"], correct: 1, exp: "সম্রাট সমুদ্রগুপ্তের বিশাল সামরিক বিজয়ের কারণে ঐতিহাসিক ভি. এ. স্মিথ তাঁকে 'ভারতের নেপোলিয়ন' আখ্যা দেন।" },
            { question: "ত্রিপুরী অধিবেশনে সুভাষচন্দ্র বসুর কাছে পরাজিত কংগ্রেস প্রার্থী কে ছিলেন?", options: ["জওহরলাল নেহেরু", "পট্টভি সিতারামাইয়া", "রাজেন্দ্র প্রসাদ", "সর্দার প্যাটেল"], correct: 1, exp: "১৯৩৯ সালের ত্রিপুরী কংগ্রেসে মহাত্মা গান্ধীর মনোনীত প্রার্থী পট্টভি সিতারামাইয়াকে হারিয়ে সুভাষচন্দ্র বসু দ্বিতীয়বার কংগ্রেস সভাপতি নির্বাচিত হন।" },
            { question: "আর্যরা প্রথম ভারতের কোথায় বসতি স্থাপন করেছিল?", options: ["পাঞ্জাব", "কাশ্মীর", "সিন্ধু", "গুজরাট"], correct: 0, exp: "আর্যরা প্রথম 'সপ্তসিন্ধু' বা পাঞ্জাব অঞ্চলে বসতি গড়ে তোলে।" },
            { question: "আইন-ই-আকবরী গ্রন্থের রচয়িতা কে?", options: ["আকবর", "আবুল ফজল", "ফৈজী", "বদায়ুনী"], correct: 1, exp: "সম্রাট আকবরের সভার নবরত্নের অন্যতম সদস্য আবুল ফজল এই বিখ্যাত গ্রন্থটি লেখেন।" },
            { question: "কত সালে মহাত্মা গান্ধী ডান্ডি অভিযান শুরু করেন?", options: ["১৯২০", "১৯৩০", "১৯৩২", "১৯৪২"], correct: 1, exp: "১৯৩০ সালের ১২ই মার্চ মহাত্মা গান্ধী সবরমতী আশ্রম থেকে ডান্ডি পর্যন্ত লবণের ওপর ব্রিটিশ করের প্রতিবাদে আইন অমান্য আন্দোলন শুরু করেন।" },
            { question: "বৌদ্ধদের পবিত্র ধর্মগ্রন্থের নাম কী?", options: ["বেদ", "ত্রিপিটক", "গীতা", "অঙ্গরাজ"], correct: 1, exp: "বৌদ্ধদের প্রধান ধর্মগ্রন্থ হলো 'ত্রিপিটক', যা পালি ভাষায় রচিত।" },
            { question: "দিল্লির সুলতানি সাম্রাজ্যের প্রথম মহিলা শাসক কে ছিলেন?", options: ["নূরজাহান", "রজিয়া সুলতানা", "চাঁদ বিবি", "মুমতাজ"], correct: 1, exp: "সুলতান ইলতুতমিশের কন্যা সুলতানা রজিয়া ১২৩৬ সালে দিল্লির সিংহাসনে বসেন।" }
        ],
        geography: [
            { question: "বিশ্বের বৃহত্তম মহাসাগর কোনটি?", options: ["আটলান্টিক মহাসাগর", "ভারত মহাসাগর", "প্রশান্ত মহাসাগর", "উত্তর মহাসাগর"], correct: 2, exp: "প্রশান্ত মহাসাগর হলো পৃথিবীর বৃহত্তম ও গভীরতম মহাসাগর।" },

            { question: "পশ্চিমবঙ্গের সর্বোচ্চ শৃঙ্গের নাম কী?", options: ["সান্দাকফু", "ফালুট", "টাইগার হিল", "বড়পাহাড়"], correct: 0, exp: "সান্দাকফু হলো পশ্চিমবঙ্গ ও নেপাল সীমান্তে অবস্থিত সিঙ্গালিলা পর্বতশ্রেণীর এবং সমগ্র পশ্চিমবঙ্গের সর্বোচ্চ শৃঙ্গ।" },

            { question: "পৃথিবীর বৃহত্তম বদ্বীপ (Delta) কোনটি?", options: ["সুন্দরবন বদ্বীপ", "আমাজন বদ্বীপ", "মিসিসিপি বদ্বীপ", "নীলনদ বদ্বীপ"], correct: 0, exp: "গঙ্গা ও ব্রহ্মপুত্র নদীর মোহনায় গঠিত সুন্দরবন বদ্বীপ হলো বিশ্বের বৃহত্তম বদ্বীপ।" },

            { question: "Which is the largest gland in the human body?", options: ["Thyroid", "Liver", "Pituitary", "Pancreas"], correct: 1, exp: "The Liver is the largest internal organ and the largest gland in the human body." }

let currentCategory = '';
let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let answered = false;

// ইন্টারফেস আপডেট করার ফাংশন
function updateUI() {
    document.getElementById("menu-title").innerText = uiLabels[currentLang].menuTitle;
    document.getElementById("cat-h-text").innerText = uiLabels[currentLang].history;
    document.getElementById("cat-g-text").innerText = uiLabels[currentLang].geography;
    document.getElementById("cat-p-text").innerText = uiLabels[currentLang].polity;
    document.getElementById("cat-s-text").innerText = uiLabels[currentLang].science;
    document.getElementById("next-button").innerText = uiLabels[currentLang].nextBtn;
    document.getElementById("exp-title-text").innerText = uiLabels[currentLang].expTitle;
    document.getElementById("result-title").innerText = uiLabels[currentLang].resultTitle;
    document.getElementById("home-btn-text").innerText = uiLabels[currentLang].homeBtn;
    
    // বোতামের লেখা পরিবর্তন
    document.getElementById("lang-toggle-btn").innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
    
    // কুইজ স্ক্রিন সচল থাকলে রানিং প্রশ্ন রি-লোড করা
    if(document.getElementById("quiz-screen").classList.contains("active-screen")) {
        currentQuestions = quizQuestions[currentLang][currentCategory];
        let currentQuestion = currentQuestions[currentQuestionIndex];
        document.getElementById("question-text").innerText = currentQuestion.question;
        document.getElementById("progress-text").innerText = `${uiLabels[currentLang].progress} ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
        
        let buttons = document.getElementById("options-box").children;
        for(let i=0; i<buttons.length; i++) {
            buttons[i].innerText = currentQuestion.options[i];
        }
        if(answered) {
            document.getElementById("explanation-text").innerText = currentQuestion.exp;
        }
    }
}

// ভাষা পরিবর্তন করার ফাংশন
function toggleLanguage() {
    currentLang = currentLang === 'bn' ? 'en' : 'bn';
    updateUI();
}

function startQuiz(category) {
    currentCategory = category;
    currentQuestions = quizQuestions[currentLang][currentCategory];
    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById("category-screen").classList.remove("active-screen");
    document.getElementById("quiz-screen").classList.add("active-screen");
    
    loadQuestion();
}

function loadQuestion() {
    answered = false;
    document.getElementById("next-button").style.display = "none";
    document.getElementById("explanation-container").style.display = "none";
    
    let currentQuestion = currentQuestions[currentQuestionIndex];
    
    document.getElementById("progress-text").innerText = `${uiLabels[currentLang].progress} ${currentQuestionIndex + 1} of ${currentQuestions.length}`;
    document.getElementById("question-text").innerText = currentQuestion.question;
    
    let optionsBox = document.getElementById("options-box");
    optionsBox.innerHTML = "";
    
    currentQuestion.options.forEach((option, index) => {
        let button = document.createElement("button");
        button.innerText = option;
        button.classList.add("option-btn");
        button.onclick = () => selectOption(button, index);
        optionsBox.appendChild(button);
    });
}

function selectOption(selectedBtn, optionIndex) {
    if(answered) return;
    answered = true;
    
    let currentQuestion = currentQuestions[currentQuestionIndex];
    let allOptions = document.getElementById("options-box").children;
    
    if(optionIndex === currentQuestion.correct) {
        selectedBtn.classList.add("correct");
        score++;
    } else {
        selectedBtn.classList.add("wrong");
        allOptions[currentQuestion.correct].classList.add("correct");
    }
    
    document.getElementById("explanation-text").innerText = currentQuestion.exp;
    document.getElementById("explanation-container").style.display = "block";
    
    document.getElementById("next-button").style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    
    if(currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
    } else {
        document.getElementById("quiz-screen").classList.remove("active-screen");
        document.getElementById("result-screen").classList.add("active-screen");
        document.getElementById("final-score-text").innerText = `Your Score: ${score} / ${currentQuestions.length}`;
    }
}

function goToHome() {
    document.getElementById("result-screen").classList.remove("active-screen");
    document.getElementById("category-screen").classList.add("active-screen");
}

// প্রারম্ভিক UI লোড
updateUI();
</script>
