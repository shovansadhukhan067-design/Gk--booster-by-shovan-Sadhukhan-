<!DOCTYPE html>
<html>
<head>
<title>GK Booster Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
font-family:Arial;
padding:20px;
background:#f5f5f5;
}
button{
display:block;
margin:10px 0;
padding:12px;
width:100%;
font-size:18px;
}
</style>
</head>
<body>

<h2>GK Booster Quiz</h2>

<p>Who is known as the Father of the Indian Constitution?</p>

<button onclick="check(false)">Mahatma Gandhi</button>
<button onclick="check(false)">Jawaharlal Nehru</button>
<button onclick="check(true)">B. R. Ambedkar</button>
<button onclick="check(false)">Subhas Chandra Bose</button>

<p id="result"></p>

<script>
function check(correct){
if(correct){
document.getElementById("result").innerHTML="✅ Correct!";
}else{
document.getElementById("result").innerHTML="❌ Wrong! Correct Answer: B. R. Ambedkar";
}
}
</script>

</body>
</html>
